# Render.com Blueprint — deploys HaulProof as an always-on web service with a persistent disk.
# In Render: New +  →  Blueprint  →  connect this repo. Render reads this file and provisions everything.
services:
  - type: web
    name: haulproof
    runtime: node
    plan: starter                 # paid instance; required for the persistent disk below (~$7/mo)
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    disk:
      name: haulproof-data        # keeps the SQLite DB + uploaded PDFs across deploys/restarts
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data          # DB + PDFs live on the persistent disk
      - key: JWT_SECRET
        generateValue: true        # Render generates a strong random secret
      - key: INGEST_API_KEY
        generateValue: true        # the driver-app device key — copy it from the dashboard to give drivers
      - key: ADMIN_EMAIL
        value: admin@callahantrans.com
      - key: ADMIN_PASSWORD
        sync: false                # you type this in the dashboard (not stored in the repo)
      - key: PORTAL_URL
        sync: false                # set to your https://<name>.onrender.com after the first deploy
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false

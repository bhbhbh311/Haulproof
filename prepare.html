<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set up signatures — HaulProof</title>
<style>
  :root{--bg:#f2f4f8;--surface:#fff;--ink:#16202b;--muted:#5c6b7a;--line:#dde4ec;--primary:#1655d1;--primary-soft:#e7eefc;--ok:#12784a;--cons:#1655d1;--driver:#b5731a;}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .bar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(20,30,50,.05);}
  .brand{font-weight:800;font-size:16px;} .brand b{color:var(--primary);}
  .ctx{color:var(--muted);font-size:13px;margin-right:auto;}
  .tool{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid #c6d0db;border-radius:8px;padding:8px 11px;background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center;}
  .tool .dot{width:10px;height:10px;border-radius:3px;}
  .tool.cons .dot{background:var(--cons);} .tool.driver .dot{background:var(--driver);}
  .tool.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);background:var(--primary-soft);}
  .btn{font-family:inherit;font-size:13px;font-weight:600;border:none;border-radius:8px;padding:9px 14px;background:var(--primary);color:#fff;cursor:pointer;}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid #c6d0db;}
  .btn.ok{background:var(--ok);}
  .hint{max-width:960px;margin:14px auto 0;padding:0 16px;color:var(--muted);font-size:13.5px;}
  #pages{max-width:960px;margin:10px auto 60px;padding:0 16px;}
  .page{position:relative;margin:14px auto;box-shadow:0 2px 10px rgba(20,30,50,.14);background:#fff;}
  .page canvas{display:block;}
  .plabel{position:absolute;top:6px;right:8px;font-size:11px;color:#8a97a6;background:rgba(255,255,255,.8);padding:1px 6px;border-radius:6px;}
  .fld{position:absolute;border:2px dashed var(--cons);background:rgba(22,85,209,.08);border-radius:6px;cursor:move;touch-action:none;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .fld.driver{border-color:var(--driver);background:rgba(181,115,26,.10);}
  .fld .lab{font-size:11px;font-weight:700;color:var(--cons);pointer-events:none;text-align:center;line-height:1.15;padding:2px;}
  .fld.driver .lab{color:var(--driver);}
  .fld .rsz{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--primary);border:2px solid #fff;cursor:nwse-resize;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .fld.driver .rsz{background:var(--driver);}
  .fld .del{position:absolute;right:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:#c0392b;color:#fff;border:2px solid #fff;font-size:18px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.4);}
  .fld .del:hover{background:#e0432f;transform:scale(1.08);}
  .fld.sel{border-style:solid;box-shadow:0 0 0 3px rgba(22,85,209,.30);}
  .fld.driver.sel{box-shadow:0 0 0 3px rgba(181,115,26,.30);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#16202b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .load{max-width:960px;margin:40px auto;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<div class="bar">
  <span class="brand">Haul<b>Proof</b> · Set up signatures</span>
  <span class="ctx" id="ctx"></span>
  <button class="tool cons on" data-role="Consignee" data-kind="sigdate"><span class="dot"></span>Consignee sign + date</button>
  <button class="tool driver" data-role="Driver" data-kind="sigdate"><span class="dot"></span>Driver sign + date</button>
  <button class="btn ok" id="saveBtn" type="button">Save setup</button>
  <button class="btn ghost" id="backBtn" type="button">Back to portal</button>
</div>
<div class="hint" id="hint">Pick a field type above, then <b>click on the document</b> where it should go. Drag to move, pull the corner to resize. To delete: click the red <b>×</b>, or click a field to select it (it gets a blue ring) and press <b>Delete</b>. Save when the layout looks right.</div>
<div id="pages"><div class="load" id="loadMsg">Loading document…</div></div>
<div class="toast" id="toast"></div>

<script src="/vendor/pdf.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  var params=new URLSearchParams(location.search);
  var DOC_ID=params.get('id');
  var toastT; function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2200);}
  var activeTool={role:'Consignee',kind:'sigdate'};
  var pageRecs=[]; var fields=[]; var selected=null; // {pageIdx,kind,role,el,xPdf,yPdf,wPdf,hPdf,baseW,baseH}
  function selectField(f){ fields.forEach(function(x){ if(x.el) x.el.classList.remove('sel'); }); selected=f||null; if(f&&f.el) f.el.classList.add('sel'); }
  function removeField(f){ if(!f) return; if(f.el&&f.el.parentNode) f.el.parentNode.removeChild(f.el); fields=fields.filter(function(x){return x!==f;}); if(selected===f) selected=null; }
  // Delete/Backspace removes the currently-selected field (unless you're typing in a field).
  document.addEventListener('keydown',function(e){
    if((e.key==='Delete'||e.key==='Backspace') && selected){
      var t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
      e.preventDefault(); removeField(selected);
    }
  });
  var DEFAULT={sigdate:{w:250,h:44},sig:{w:190,h:46},date:{w:120,h:34}};

  // toolbar
  Array.prototype.forEach.call(document.querySelectorAll('.tool'),function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tool').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); activeTool={role:b.dataset.role,kind:b.dataset.kind};
    });
  });
  var backTo='/';
  $('#backBtn').addEventListener('click',function(){ location.href=backTo; });

  if(!DOC_ID){ $('#loadMsg').textContent='No document id — open this from the portal.'; return; }
  if(!window.pdfjsLib){ $('#loadMsg').textContent='PDF engine failed to load (needs internet for this preview).'; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc='/vendor/pdf.worker.js';

  var meta=null;
  fetch('/api/pods/'+DOC_ID,{credentials:'include'}).then(function(r){return r.json();}).then(function(m){
    if(m.error){ $('#loadMsg').textContent=m.error; return; }
    meta=m; $('#ctx').textContent='PO '+(m.poNumber||'—')+(m.loadNumber?(' · Load '+m.loadNumber):'')+(m.consignee?(' · '+m.consignee):'');
    if(m.loadId){ backTo='/?load='+encodeURIComponent(m.loadId); $('#backBtn').textContent='← Back to load'; }
    return fetch('/api/pods/'+DOC_ID+'/file',{credentials:'include'}).then(function(r){return r.arrayBuffer();});
  }).then(function(buf){
    if(!buf) return;
    return pdfjsLib.getDocument({data:buf}).promise;
  }).then(function(pdf){
    if(!pdf) return;
    var wrap=$('#pages'); wrap.innerHTML='';
    var maxW=Math.min(900,(document.body.clientWidth-40));
    var chain=Promise.resolve();
    for(var n=1;n<=pdf.numPages;n++){ (function(n){
      chain=chain.then(function(){ return pdf.getPage(n); }).then(function(page){
        var base=page.getViewport({scale:1});
        var scale=Math.min(2,Math.max(0.6,maxW/base.width));
        var vp=page.getViewport({scale:scale});
        var pd=document.createElement('div'); pd.className='page'; pd.style.width=vp.width+'px'; pd.style.height=vp.height+'px';
        var cv=document.createElement('canvas'); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height); pd.appendChild(cv);
        var lb=document.createElement('div'); lb.className='plabel'; lb.textContent='Page '+n+' / '+pdf.numPages; pd.appendChild(lb);
        wrap.appendChild(pd);
        var rec={idx:n-1,div:pd,vp:vp,scale:scale,baseW:base.width,baseH:base.height};
        pageRecs.push(rec);
        pd.addEventListener('click',function(e){ if(e.target!==pd&&e.target!==cv) return; addField(rec,e); });
        return page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      });
    })(n); }
    chain.then(function(){ loadExisting(); });
  }).catch(function(e){ console.error(e); $('#loadMsg').textContent='Could not load the document.'; });

  function labelText(role,kind){ return role+'\n'+(kind==='sigdate'?'signature + date':(kind==='sig'?'signature':'date')); }

  function addField(rec,e){
    var r=rec.div.getBoundingClientRect();
    var d=DEFAULT[activeTool.kind];
    var left=Math.max(0,Math.min(rec.div.clientWidth-d.w,(e.clientX-r.left)-d.w/2));
    var top=Math.max(0,Math.min(rec.div.clientHeight-d.h,(e.clientY-r.top)-d.h/2));
    var f={pageIdx:rec.idx,kind:activeTool.kind,role:activeTool.role,rec:rec};
    var el=document.createElement('div'); el.className='fld'+(f.role==='Driver'?' driver':'');
    el.style.left=left+'px'; el.style.top=top+'px'; el.style.width=d.w+'px'; el.style.height=d.h+'px';
    el.innerHTML='<div class="lab">'+labelText(f.role,f.kind).replace('\n','<br>')+'</div><div class="rsz"></div><div class="del">×</div>';
    rec.div.appendChild(el); f.el=el; fields.push(f);
    wireDrag(f); wireResize(f); recompute(f);
    el.addEventListener('pointerdown',function(){ selectField(f); });
    el.querySelector('.del').addEventListener('click',function(ev){ ev.stopPropagation(); removeField(f); });
    selectField(f);
  }

  function wireDrag(f){
    f.el.addEventListener('pointerdown',function(e){
      if(e.target.classList.contains('rsz')||e.target.classList.contains('del')) return;
      e.preventDefault(); var rec=f.rec, el=f.el;
      var sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;
      try{el.setPointerCapture(e.pointerId);}catch(_){}
      function cl(v,w){return Math.max(0,Math.min(rec.div.clientWidth-w,v));}
      function ct(v,h){return Math.max(0,Math.min(rec.div.clientHeight-h,v));}
      function mv(ev){ el.style.left=cl(ox+(ev.clientX-sx),el.offsetWidth)+'px'; el.style.top=ct(oy+(ev.clientY-sy),el.offsetHeight)+'px'; }
      function up(){ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); recompute(f); }
      el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
    });
  }
  function wireResize(f){
    var h=f.el.querySelector('.rsz');
    h.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation();
      var el=f.el,sx=e.clientX,sy=e.clientY,ow=el.offsetWidth,oh=el.offsetHeight;
      try{h.setPointerCapture(e.pointerId);}catch(_){}
      function mv(ev){ el.style.width=Math.max(46,ow+(ev.clientX-sx))+'px'; el.style.height=Math.max(22,oh+(ev.clientY-sy))+'px'; }
      function up(){ h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up); recompute(f); }
      h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up);
    });
  }
  function recompute(f){
    var el=f.el,rec=f.rec;
    var p1=rec.vp.convertToPdfPoint(el.offsetLeft,el.offsetTop+el.offsetHeight);
    var p2=rec.vp.convertToPdfPoint(el.offsetLeft+el.offsetWidth,el.offsetTop);
    f.xPdf=Math.min(p1[0],p2[0]); f.yPdf=Math.min(p1[1],p2[1]); f.wPdf=Math.abs(p2[0]-p1[0]); f.hPdf=Math.abs(p1[1]-p2[1]);
    f.baseW=rec.baseW; f.baseH=rec.baseH;
  }

  function placeFromData(fd){
    var rec=pageRecs[fd.pageIdx]; if(!rec) return;
    var tl=rec.vp.convertToViewportPoint(fd.xPdf, fd.yPdf+fd.hPdf);
    var br=rec.vp.convertToViewportPoint(fd.xPdf+fd.wPdf, fd.yPdf);
    var left=Math.min(tl[0],br[0]), top=Math.min(tl[1],br[1]), w=Math.abs(br[0]-tl[0]), hh=Math.abs(br[1]-tl[1]);
    var f={pageIdx:fd.pageIdx,kind:fd.kind,role:fd.role,rec:rec};
    var el=document.createElement('div'); el.className='fld'+(f.role==='Driver'?' driver':'');
    el.style.left=left+'px'; el.style.top=top+'px'; el.style.width=w+'px'; el.style.height=hh+'px';
    el.innerHTML='<div class="lab">'+labelText(f.role,f.kind).replace('\n','<br>')+'</div><div class="rsz"></div><div class="del">×</div>';
    rec.div.appendChild(el); f.el=el; fields.push(f);
    wireDrag(f); wireResize(f); recompute(f);
    el.addEventListener('pointerdown',function(){ selectField(f); });
    el.querySelector('.del').addEventListener('click',function(ev){ ev.stopPropagation(); removeField(f); });
  }
  function loadExisting(){ (meta&&meta.fields||[]).forEach(placeFromData); }

  $('#saveBtn').addEventListener('click',function(){
    var out=fields.map(function(f){ return {pageIdx:f.pageIdx,kind:f.kind,role:f.role,xPdf:f.xPdf,yPdf:f.yPdf,wPdf:f.wPdf,hPdf:f.hPdf,baseW:f.baseW,baseH:f.baseH}; });
    fetch('/api/pods/'+DOC_ID+'/fields',{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:out})})
      .then(function(r){return r.json();}).then(function(j){
        if(j.error){ toast(j.error); return; }
        toast('Saved '+j.count+' field'+(j.count===1?'':'s')+' — ready for the driver');
      }).catch(function(){ toast('Save failed'); });
  });
})();
</script>
</body>
</html>
